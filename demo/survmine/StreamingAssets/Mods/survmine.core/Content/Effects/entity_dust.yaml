id: survmine:entity_dust

# Renderer (original: Default layer, order 0, billboard, max particle size 0.5)
sortingLayerName: Default
sortingOrder: 0
renderMode: Billboard
alignment: View
sortMode: None
minParticleSize: 0
maxParticleSize: 0.5
materialShader: SpriteLit

# Main module
duration: 5
loop: true
playOnAwake: false
simulationSpace: World
scalingMode: Hierarchy
maxParticles: 1000
gravityModifier: 0
startLifetime:
  min: 0.3
  max: 0.5
startSpeed:
  min: 1.25
  max: 1.25
startSize:
  min: 0.085
  max: 0.1
startRotation:
  min: 0
  max: 0
startColor:
  r: 0.49
  g: 0.49
  b: 0.49
  a: 1

# Emission module: 15 particles per second while the entity runs on the ground
rateOverTime: 15
bursts: []

# Shape module: cone pointing down at the feet, rotated for the 2D plane
shape: Cone
shapeAngle: 22.68
shapeRadius: 1
radiusThickness: 1
shapeRotation: { x: 270, y: 0, z: 0 }
shapeScale: { x: 1, y: 1, z: 1 }

# Collision module: original dust collided against the Default layer
collision:
  enabled: true
  type: World
  mode: Collision2D
  dampen: 0
  bounce: 1
  lifetimeLoss: 0
  minKillSpeed: 0
  maxKillSpeed: 10000
  radiusScale: 1
  layerMask: Default
  collidesWithDynamic: true
  voxelSize: 0.5
  quality: 0
  maxCollisionShapes: 256
