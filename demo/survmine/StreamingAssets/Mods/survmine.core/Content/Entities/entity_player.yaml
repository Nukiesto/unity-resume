stableId: survmine:entity/player
extends: survmine:entity/base
prefabKey: survmine:mob
role: player
visual:
  rigProfile: survmine:rig/humanoid
  mobVisual: survmine:visual/player
  animationSet: survmine:animations/player
  animationEvents: survmine:events/player_attack
  colliderProfile: survmine:collider/player
  ragdollProfile: survmine:ragdoll/player
components:
  - kindId: survmine:alive
    patch: {}
  - kindId: survmine:animated_character
    patch: {}
  - kindId: survmine:armor_renderer
    patch:
      bodyArmorSlot: 'armor.body'
      headArmorSlot: 'armor.head'
      leftArmArmorSlot: 'armor.left_arm'
      leftBootArmorSlot: 'armor.left_boot'
      leftLegArmorSlot: 'armor.left_leg'
      rightArmArmorSlot: 'armor.right_arm'
      rightBootArmorSlot: 'armor.right_boot'
      rightLegArmorSlot: 'armor.right_leg'
  - kindId: survmine:audio
    patch:
      audioInterval: 0
      deathAudioSlot: 'audio.death'
      eatingAudioSlot: 'audio.eating'
      fallBigAudioSlot: 'audio.fall_big'
      fallSmallAudioSlot: 'audio.fall_small'
      takeDamageAudioSlot: 'audio.take_damage'
      walkAudioSlot: 'audio.walk'
      takeDamageClips:
        - 'survmine.core:Minecraft/random/classic_hurt'
  - kindId: survmine:burn
    patch:
      burnRendererSlot: 'burn.renderer'
  - kindId: survmine:camera_target
    patch: {}
  - kindId: survmine:can_suffocate
    patch: {}
  - kindId: survmine:character_controller
    patch:
      boxColliderSlot: 'controller.collider'
      gameObjectSlot: 'controller.game_object'
      jumpingThreshold: 0
      oneWayPlatformMask: 8
      platformMask: 512
      rigidbodySlot: 'controller.rigidbody'
      skinWidth: 0.0248
      slopeLimit: 0
      slopeSpeedMultiplier:
        preWrapMode: ClampForever
        postWrapMode: ClampForever
        keys:
          -
            time: 1
            value: 1
            inTangent: 0
            outTangent: 0
            inWeight: 0
            outWeight: 0
            weightedMode: None
      totalHorizontalRays: 6
      totalVerticalRays: 6
      transformSlot: 'controller.transform'
      triggerMask: 1232
  - kindId: survmine:chunk_observer
    patch: {}
  - kindId: survmine:flight
    patch:
      flySpeedHorizontal: 10
      flySpeedVertical: 5
  - kindId: survmine:health
    patch:
      healthSyncSlot: 'health.sync'
      hpDefault: 100
      hpMax: 100
  - kindId: survmine:held_item
    patch:
      itemInHandSyncSlot: 'held_item.sync'
  - kindId: survmine:movement
    patch:
      dustEffectStableId: 'survmine:entity_dust'
      fallDamageMax: 10
      fallDamageMin: 7
      gravity: -25
      groundDamping: 20
      inAirDamping: 5
      jumpHeight: 1.1
      ladderMoveSpeed: 4
      minFallDistance: 5
      runSpeed: 6
  - kindId: survmine:player
    patch:
      primarySlot: 'player.item_create'
  - kindId: survmine:player_tag
    patch: {}
  - kindId: survmine:ragdoll
    patch:
      fadeOutTime: 5
  - kindId: survmine:sword
    patch:
      damageDelay: 0.2
      swordLayerMask: 256
      swordPositionSlot: 'sword.position'
  - kindId: survmine:sync
    patch:
      netId: 0
removeComponents:
