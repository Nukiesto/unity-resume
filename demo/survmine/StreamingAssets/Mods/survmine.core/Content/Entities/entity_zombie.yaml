stableId: survmine:entity/zombie
extends: survmine:entity/base
prefabKey: survmine:mob
role: enemy
visual:
  rigProfile: survmine:rig/humanoid
  mobVisual: survmine:visual/zombie
  animationSet: survmine:animations/zombie
  animationEvents: survmine:events/zombie_attack
  colliderProfile: survmine:collider/zombie
  ragdollProfile: survmine:ragdoll/zombie
naturalSpawn:
  dayTime: Night
  weight: 100
  cap: 10
  footprint:
    width: 1
    height: 2
    requiresSolidGround: true
components:
  - kindId: survmine:alive
    patch: {}
  - kindId: survmine:animated_character
    patch: {}
  - kindId: survmine:armor_renderer
    patch:
      bodyArmorSlot: 'armor.body'
      headArmorSlot: 'armor.head'
      leftArmArmorSlot: 'armor.left_arm'
      leftBootArmorSlot: 'armor.left_boot'
      leftLegArmorSlot: 'armor.left_leg'
      rightArmArmorSlot: 'armor.right_arm'
      rightBootArmorSlot: 'armor.right_boot'
      rightLegArmorSlot: 'armor.right_leg'
  - kindId: survmine:audio
    patch:
      audioInterval: 0
      deathAudioSlot: 'audio.death'
      eatingAudioSlot: 'audio.eating'
      fallBigAudioSlot: 'audio.fall_big'
      fallSmallAudioSlot: 'audio.fall_small'
      takeDamageAudioSlot: 'audio.take_damage'
      walkAudioSlot: 'audio.walk'
      walkClips:
        - 'survmine.core:Minecraft/mob/zombie/step1'
        - 'survmine.core:Minecraft/mob/zombie/step2'
        - 'survmine.core:Minecraft/mob/zombie/step3'
        - 'survmine.core:Minecraft/mob/zombie/step4'
        - 'survmine.core:Minecraft/mob/zombie/step5'
      attackClips:
        - 'survmine.core:Minecraft/mob/zombie/say1'
        - 'survmine.core:Minecraft/mob/zombie/say2'
        - 'survmine.core:Minecraft/mob/zombie/say3'
      takeDamageClips:
        - 'survmine.core:Minecraft/mob/zombie/hurt1'
        - 'survmine.core:Minecraft/mob/zombie/hurt2'
      deathClips:
        - 'survmine.core:Minecraft/mob/zombie/death'
  - kindId: survmine:bot
    patch:
      chaseMemoryTime: 5
      findPlayerOverSolid: false
      mustMoveToPlayer: true
      resumeChaseDistance: 1.3
      stopDistanceFoundPlayer: 0.8
      viewDistance: 12
  - kindId: survmine:burn
    patch:
      burnRendererSlot: 'burn.renderer'
  - kindId: survmine:can_suffocate
    patch: {}
  - kindId: survmine:character_controller
    patch:
      boxColliderSlot: 'controller.collider'
      gameObjectSlot: 'controller.game_object'
      jumpingThreshold: 0
      oneWayPlatformMask: 8
      platformMask: 512
      rigidbodySlot: 'controller.rigidbody'
      skinWidth: 0.0248
      slopeLimit: 0
      slopeSpeedMultiplier:
        preWrapMode: ClampForever
        postWrapMode: ClampForever
        keys:
          -
            time: 1
            value: 1
            inTangent: 0
            outTangent: 0
            inWeight: 0
            outWeight: 0
            weightedMode: None
      totalHorizontalRays: 6
      totalVerticalRays: 6
      transformSlot: 'controller.transform'
      triggerMask: 17552
  - kindId: survmine:damage
    patch:
      damage: 20
      damageDelay: 1.5
      kickLayerMask: 256
      kickPositionSlot: 'damage.origin'
      kickRadius: 1.2
  - kindId: survmine:health
    patch:
      healthSyncSlot: 'health.sync'
      hpDefault: 100
      hpMax: 100
  - kindId: survmine:held_item
    patch:
      itemInHandSyncSlot: 'held_item.sync'
  - kindId: survmine:idle
    patch:
      enterStateTimeMax: 4
      enterStateTimeMin: 3
      randomMoveTimeMax: 10
      randomMoveTimeMin: 5
  - kindId: survmine:movement
    patch:
      dustEffectStableId: 'survmine:entity_dust'
      fallDamageMax: 10
      fallDamageMin: 7
      gravity: -25
      groundDamping: 20
      inAirDamping: 5
      jumpHeight: 1.1
      ladderMoveSpeed: 4
      minFallDistance: 5
      runSpeed: 2
  - kindId: survmine:ragdoll
    patch:
      fadeOutTime: 3
  - kindId: survmine:sword
    patch:
      damageDelay: 0.2
      swordLayerMask: 256
      swordPositionSlot: 'sword.position'
  - kindId: survmine:sync
    patch:
      netId: 0
removeComponents:
