blockTile: iron_ore
itemBlockStableId: survmine:iron_ore
components:
- !ore
  # Вертикальный диапазон генерации (в блоках от уровня моря)
  minGenerationHeight: 32    # Минимальная высота (ниже — ближе к центру мира)
  maxGenerationHeight: 80    # Максимальная высота
  
  # Редкость залежей: вероятность появления в ячейке сетки (0.0–1.0)
  veinSpawnChance: 0.45      # 35% шанс появления залежи в ячейке
  
  # Размер залежи (количество блоков руды в одной вене)
  veinSizeMin: 5             # Минимум 5 блоков
  veinSizeMax: 14            # Максимум 14 блоков
  
  # Плотность распределения: размер ячейки сетки в блоках
  # Меньше значение = чаще залежи (но не чаще чем раз в ячейку)
  veinSpacing: 20            # Залежи размещаются в сетке 20×20 блоков
stableId: survmine:iron_ore
