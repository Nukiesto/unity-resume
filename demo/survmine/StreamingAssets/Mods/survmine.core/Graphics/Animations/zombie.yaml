stableId: survmine:animations/zombie
formatVersion: 1
rigProfile: survmine:rig/humanoid
states:
  - key: idle
    loop: true
    interruptible: true
    resume: false
    duration: 2
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
          - time: 2
            position: { x: 0, y: 0.02 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: -2
            scale: { x: 1, y: 1 }
            easing: ease_in_out
