            position: { x: 0, y: 0 }
            rotation: 2
            scale: { x: 1, y: 1 }
            easing: ease_in_out
      - partKey: arm_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
