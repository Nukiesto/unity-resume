stableId: survmine:animations/cow
formatVersion: 1
rigProfile: survmine:rig/quadruped_cow
states:
  - key: idle
    loop: true
    interruptible: true
    resume: false
    duration: 2
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
          - time: 2
            position: { x: 0, y: 0.02 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: -3
            scale: { x: 1, y: 1 }
            easing: ease_in_out
          - time: 2
            position: { x: 0, y: 0 }
            rotation: 3
            scale: { x: 1, y: 1 }
            easing: ease_in_out
      - partKey: leg_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
          - time: 2
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
      - partKey: leg_back
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
          - time: 2
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in_out
  - key: walk
    loop: true
    interruptible: true
    resume: false
    duration: 0.8
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.4
            position: { x: 0, y: 0.04 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.8
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.4
            position: { x: 0.03, y: -0.02 }
            rotation: 4
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.8
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
      - partKey: leg_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 20
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: -20
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.8
            position: { x: 0, y: 0 }
            rotation: 20
            scale: { x: 1, y: 1 }
            easing: linear
      - partKey: leg_back
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: -20
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: 20
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.8
            position: { x: 0, y: 0 }
            rotation: -20
            scale: { x: 1, y: 1 }
            easing: linear
  - key: fall
    loop: true
    interruptible: true
    resume: false
    duration: 0.5
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.5
            position: { x: 0, y: -0.02 }
            rotation: 0
            scale: { x: 1.05, y: 0.95 }
            easing: linear
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.5
            position: { x: 0, y: 0 }
            rotation: -6
            scale: { x: 1, y: 1 }
            easing: linear
      - partKey: leg_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.5
            position: { x: 0, y: 0 }
            rotation: 12
            scale: { x: 1, y: 1 }
            easing: linear
      - partKey: leg_back
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: linear
          - time: 0.5
            position: { x: 0, y: 0 }
            rotation: -12
            scale: { x: 1, y: 1 }
            easing: linear
  - key: hurt
    loop: false
    interruptible: true
    resume: false
    duration: 0.4
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: -0.08, y: 0 }
            rotation: -4
            scale: { x: 1.1, y: 0.9 }
            easing: ease_out
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: -8
            scale: { x: 1, y: 1 }
            easing: ease_out
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
      - partKey: leg_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
      - partKey: leg_back
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
          - time: 0.4
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_out
  - key: death
    loop: false
    interruptible: false
    resume: false
    duration: 1
    tracks:
      - partKey: body
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in
          - time: 1
            position: { x: 0, y: -0.3 }
            rotation: 80
            scale: { x: 1.1, y: 0.7 }
            easing: ease_in
      - partKey: head
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in
          - time: 1
            position: { x: 0, y: -0.1 }
            rotation: 30
            scale: { x: 1, y: 1 }
            easing: ease_in
      - partKey: leg_front
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in
          - time: 1
            position: { x: 0, y: 0 }
            rotation: 45
            scale: { x: 1, y: 1 }
            easing: ease_in
      - partKey: leg_back
        required: true
        keys:
          - time: 0
            position: { x: 0, y: 0 }
            rotation: 0
            scale: { x: 1, y: 1 }
            easing: ease_in
          - time: 1
            position: { x: 0, y: 0 }
            rotation: 45
            scale: { x: 1, y: 1 }
            easing: ease_in
